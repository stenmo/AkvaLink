name: akvalink
description: "AkvaLink — battery-powered Matter pool & aquatic temperature sensor companion (iOS, Android, Windows, Linux, macOS)."
publish_to: 'none'

# Kept in lock-step with the firmware version (../version.txt).
version: 0.3.2+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Cross-platform BLE (iOS, Android, Windows, Linux, macOS) — the same library
  # the u-connectXplorer app uses, proven across every target platform.
  universal_ble: ^1.2.0
  provider: ^6.1.5
  shared_preferences: ^2.5.4
  http: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Generates platform launcher icons from assets/icon.png.
  # Run once after changing the icon:
  #   cd app_flutter && flutter pub run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  # Source image (1024×1024, generated by scripts/generate_icon.py).
  image_path: "assets/icon.png"
  android: "launcher_icon"
  ios: true
  windows:
    generate: true
    image_path: "assets/icon.png"
    icon_size: 48
  linux:
    generate: true
    image_path: "assets/icon.png"
    icon_size: 64
  macos:
    generate: true
    image_path: "assets/icon.png"
  web:
    generate: true
    image_path: "assets/icon.png"
    background_color: "#033f63"
    theme_color: "#033f63"

flutter:
  uses-material-design: true

  assets:
    - assets/
